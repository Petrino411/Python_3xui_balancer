# Полный образец конфигурации xray-client-balancer.
#
# Живой конфиг создаёт команда `xcb init` (/etc/xray-client-balancer/config.yaml):
# она сама подставляет теги исходящих, выбранные из панели. Этот файл — справочник
# по всем ключам; менять его для запуска не нужно.
#
# Секрет в файле не хранится: api_token берёт значение из окружения — оно лежит в
# /etc/xray-client-balancer/env (права 600) как XRAY_BALANCER_API_TOKEN=...

panel:
  # URL панели вместе с base path, если он включён: https://127.0.0.1:21868/AbCdEf/
  # Если сервис стоит на узле с панелью, `xcb init` определяет URL сам из /etc/x-ui/x-ui.db.
  url: "https://127.0.0.1:21868/"
  api_token: "${XRAY_BALANCER_API_TOKEN}"
  verify_tls: true
  # ca_bundle: "/root/cert/panel/fullchain.pem"   # если у панели самоподписанный сертификат
  tls_verify_hostname: false    # панель слушает loopback, сертификат — на другое имя
  timeout_seconds: 15
  retries: 4                    # 5s -> 10s -> 20s -> 30s (потолок max_backoff_seconds)
  backoff_seconds: 5
  max_backoff_seconds: 30

# Группы: каждая — один основной исходящий. В selector обязан быть ровно один
# outbound, иначе ядро начнёт выбирать outbound на каждое соединение.
balancers:
  - tag: "client-balancer-1"
    primary: "sub1-mskserv"
    strategy: "leastLoad"
    # strategy_settings: { expected: 1, baselines: ["300ms"], maxRTT: "1s", tolerance: 0.1 }
  - tag: "client-balancer-2"
    primary: "sub2-cringe"
    strategy: "leastLoad"
  - tag: "client-balancer-3"
    primary: "sub3-tls-riga2-tls"
    strategy: "leastLoad"

# Общий резерв: на него уходит трафик группы, когда её основной исходящий не отвечает.
fallback:
  outbound: "sub1-tls-stock-tls"

# Куда сервис вставляет свои правила в routing.rules.
routing:
  # bottom (по умолчанию) — пользовательские правила сохраняют приоритет;
  # top — блок выше пользовательских правил (панель всё равно поднимает своё api-правило);
  # after_rule — сразу после правила, в котором встречается insert_after_rule.
  managed_position: "bottom"
  insert_after_rule: ""
  write_rule_tag: true

# Healthcheck ядра, без которого fallbackTag не работает.
observatory:
  type: "auto"                                  # auto | observatory | burst
  probe_url: "https://www.gstatic.com/generate_204"
  probe_interval: "30s"
  burst_interval: "30s"
  burst_timeout: "5s"
  burst_sampling: 2
  burst_http_method: "HEAD"

sync:
  interval_seconds: 30

state:
  database: "/var/lib/xray-client-balancer/state.db"

backups:
  enabled: true
  directory: "/var/lib/xray-client-balancer/backups"
  keep: 20

safety:
  refuse_empty_panel: true        # пустой ответ API не считается «клиентов 0»
  config_repair_attempts: 1       # повторный merge при расхождении после записи
  churn_breaker_cycles: 3         # 3 цикла подряд с repair -> автозаписи останавливаются
  xray_ready_timeout: 30          # сколько ждать подъёма ядра после записи, потом откат

validation:
  local_xray_test: false          # true — прогонять `xray run -test` до записи (нужен бинарник ниже)
  xray_binary: "/usr/local/x-ui/bin/xray-linux-amd64"
  route_test: true                # после записи спросить у ядра маршрут по одному клиенту из группы
  route_test_domain: "example.com"

# Клиенты, которых сервис не трогает вообще.
exclude_clients: []
exclude_regex: []

# disabled/expired/закончившийся трафик: назначение сохраняем (клиент вернётся в свою группу)
include_disabled: true
